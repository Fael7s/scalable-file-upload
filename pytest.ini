[pytest]
testpaths = tests
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

filterwarnings =
    # botocore 1.35.x signs requests with datetime.utcnow(). The call is in the
    # vendored SDK, not in this project, and cannot be silenced without moving
    # off the pinned boto3 version.
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning:botocore.auth
